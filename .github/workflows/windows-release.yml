name: Windows build and release


on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write


jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v


  package-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GridResilienceStudio
          --collect-all tkinter
          grid_resilience_desktop.py
      - name: Smoke-test analytical modules
        run: >-
          python -c "from grid_resilience import sample_network; from grid_resilience_ac import ACPowerFlowEngine, EconomicDispatchEngine; n=sample_network(); assert ACPowerFlowEngine().solve(n).converged; assert EconomicDispatchEngine().optimize_and_validate(n).ac_power_flow"
      - name: Mark unsigned build by default
        shell: pwsh
        run: >-
          Set-Content -Path dist/GridResilienceStudio-signing-status.txt -Value "UNSIGNED: Authenticode credentials or timestamp configuration were not supplied to this protected workflow." -NoNewline
      - name: Authenticode sign and verify when credentials are configured
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -and $env:WINDOWS_CERT_PASSWORD -and $env:AUTHENTICODE_TIMESTAMP_URL) {
            & .github/scripts/sign-windows-artifact.ps1 -ArtifactPath dist/GridResilienceStudio.exe -CertificateBase64 $env:WINDOWS_CERT_BASE64 -CertificatePassword $env:WINDOWS_CERT_PASSWORD -TimestampUrl $env:AUTHENTICODE_TIMESTAMP_URL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Authenticode signing skipped because protected credentials or timestamp configuration are unavailable."
          }
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
