name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install report test dependency
        run: python -m pip install --upgrade fpdf2
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GridResilienceStudio
          --collect-all tkinter
          grid_resilience_desktop.py
      - name: Smoke-test analytical modules
        run: >-
          python -c "from grid_resilience import sample_network; from grid_resilience_ac import ACPowerFlowEngine, EconomicDispatchEngine; n=sample_network(); assert ACPowerFlowEngine().solve(n).converged; assert EconomicDispatchEngine().optimize_and_validate(n).ac_power_flow"
      - name: Mark unsigned build by default
        shell: pwsh
        run: >-
          Set-Content -Path dist/GridResilienceStudio-signing-status.txt -Value "UNSIGNED: Authenticode credentials or timestamp configuration were not supplied to this protected workflow." -NoNewline
      - name: Authenticode sign and verify when credentials are configured
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -and $env:WINDOWS_CERT_PASSWORD -and $env:AUTHENTICODE_TIMESTAMP_URL) {
            & .github/scripts/sign-windows-artifact.ps1 -ArtifactPath dist/GridResilienceStudio.exe -CertificateBase64 $env:WINDOWS_CERT_BASE64 -CertificatePassword $env:WINDOWS_CERT_PASSWORD -TimestampUrl $env:AUTHENTICODE_TIMESTAMP_URL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Authenticode signing skipped because protected credentials or timestamp configuration are unavailable."
          }
      - name: Create signing-status attestation
        shell: pwsh
        run: |
          $artifact = "dist/GridResilienceStudio.exe"
          $signature = Get-AuthenticodeSignature -FilePath $artifact
          $status = [ordered]@{
            schema = "grid-resilience/signing-status/1.0"
            artifact = "GridResilienceStudio.exe"
            sha256 = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
            signingStatus = $signature.Status.ToString()
            statusMessage = $signature.StatusMessage
            certificateSubject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            certificateThumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { $null }
            timestampUtc = (Get-Date).ToUniversalTime().ToString("o")
            workflowRun = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          $status | ConvertTo-Json -Depth 4 | Set-Content -Path dist/GridResilienceStudio-signing-status.json -Encoding utf8
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridResilienceStudio-Windows
          path: |
            dist/GridResilienceStudio.exe
            dist/GridResilienceStudio-signing-status.txt
            dist/GridResilienceStudio-signing-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest executable provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/GridResilienceStudio.exe

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: GridResilienceStudio-Windows
          path: release-assets
      - name: Generate checksum
        run: sha256sum release-assets/GridResilienceStudio.exe > release-assets/GridResilienceStudio.exe.sha256
      - name: Generate changelog from git history
        run: |
          git log --pretty=format:'- %s (%h)' > release-assets/CHANGELOG.md
          printf '\n' >> release-assets/CHANGELOG.md
      - name: Create release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/CHANGELOG.md
          files: |
            release-assets/GridResilienceStudio.exe
            release-assets/GridResilienceStudio.exe.sha256
            release-assets/GridResilienceStudio-signing-status.txt
            release-assets/GridResilienceStudio-signing-status.json
            release-assets/CHANGELOG.md
