[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-fuzzy-finance"
version = "0.1.0"
description = "A comprehensive quantitative finance framework integrating fuzzy logic, reinforcement learning, and advanced mathematical methods from past, present, and future financial sciences"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quantum Fuzzy Developer", email = "developer@quantum-fuzzy.finance"}
]
keywords = [
    "quantitative finance",
    "fuzzy logic",
    "reinforcement learning",
    "portfolio optimization",
    "credit scoring",
    "algorithmic trading",
    "financial modeling",
    "risk management",
    "machine learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Office/Business :: Financial :: Insurance",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
ml = [
    "torch>=1.9.0",
    "scikit-learn>=1.0.0",
]
full = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "torch>=1.9.0",
    "scikit-learn>=1.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/quantum-fuzzy/quantum-fuzzy-finance"
Documentation = "https://github.com/quantum-fuzzy/quantum-fuzzy-finance#readme"
Repository = "https://github.com/quantum-fuzzy/quantum-fuzzy-finance.git"
"Bug Tracker" = "https://github.com/quantum-fuzzy/quantum-fuzzy-finance/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_fuzzy_finance*"]

[tool.setuptools.package-data]
quantum_fuzzy_finance = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=quantum_fuzzy_finance --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
