[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-resilience"
version = "1.0.0"
description = "Deterministic N-1 grid resilience screening with a Windows desktop interface."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ali Marandi"}]
keywords = ["power-systems", "n-1", "contingency-analysis", "resilience", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
grid-resilience = "grid_resilience_desktop:main"

[tool.setuptools]
py-modules = ["grid_resilience", "grid_resilience_desktop"]

[tool.unittest]
start-directory = "tests"
